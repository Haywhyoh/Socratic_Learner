# Production compose for the VPS. Local Postgres-only setup stays in backend/docker-compose.yml.
#
# Required on the server next to this file:
#   .env  (copy from .env.example and fill secrets)
#
# Images are published by .github/workflows/deploy.yml

name: socratic-learner

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socratic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socratic}
      POSTGRES_DB: ${POSTGRES_DB:-socratic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socratic} -d ${POSTGRES_DB:-socratic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-ghcr.io/haywhyoh/socratic-learner-api:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SANDBOX_WORKSPACES_ROOT: /app/data/workspaces
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
    volumes:
      - workspace_data:/app/data/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-ghcr.io/haywhyoh/socratic-learner-web:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"

volumes:
  postgres_data:
  workspace_data:
